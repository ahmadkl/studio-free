name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths-ignore: ['**.md']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: App icon
        run: npx @capacitor/assets generate --android --assetPath resources
        continue-on-error: true

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: ai-studio-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish as the "latest" release (easy download from the phone)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk ai-studio.apk
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest ai-studio.apk \
            --title "استوديو الذكاء (آخر نسخة)" \
            --notes "حمّل الملف ai-studio.apk وثبّته على هاتف أندرويد."
